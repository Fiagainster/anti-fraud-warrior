name: static-check

on:
  push:
    branches: [main, feat/**, fix/**, content/**]
  pull_request:

jobs:
  static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow
      - name: Compile Python tools
        run: python -m compileall -q tools
      - name: Static content checks (no engine needed)
        run: python tools/ci_static.py
      - name: Build PK3 (generates maps/fonts if missing; needs vendor)
        if: ${{ hashFiles('vendor/manifest.json') != '' && hashFiles('vendor/freedoom-0.13.0/freedoom1.wad') != '' }}
        run: python tools/build.py
