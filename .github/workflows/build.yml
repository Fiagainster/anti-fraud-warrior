name: static-check

on:
  push:
    branches: [main, feat/**, fix/**, content/**]
  pull_request:

jobs:
  static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Compile Python tools
        run: python -m compileall -q tools

      - name: Static content checks (no engine needed)
        run: python tools/ci_static.py

      # vendor/ is gitignored, so the previous "build only if vendor exists"
      # step could never run and CI quietly verified nothing but syntax.
      # The IWAD is BSD-licensed, so fetch it and check the real thing.
      - name: Fetch Freedoom IWAD (BSD-3-Clause)
        shell: pwsh
        run: |
          $url = "https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip"
          Invoke-WebRequest -Uri $url -OutFile freedoom.zip
          Expand-Archive -Path freedoom.zip -DestinationPath . -Force
          python tools/fetch_vendor.py import --freedoom freedoom-0.13.0/freedoom1.wad

      - name: Generate the three chapters (checks every texture name vs the IWAD)
        run: python tools/gen_maps.py

      # Font atlases come from the Fusion Pixel ttf, which has no stable
      # public URL, so this step covers map/MAPINFO/zscript packing only.
      # ZScript compilation and the real HUD font path need the engine and
      # stay local:  python tools/fz_ctl.py check  /  tour
      - name: Pack PK3 (font atlases intentionally not verified here)
        env:
          FZ_ALLOW_NO_FONTS: "1"
        run: python tools/build.py
